<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phomab</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAF5;--ink:#17201B;--mute:#5B665F;--green:#0F3D2E;--sun:#F2B705;--line:#D9E0D6;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0E1512;--ink:#EEF2EA;--mute:#9AA79F;--green:#1B5A44;--line:#27332D;--card:#16201B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 18px 48px}
.brand{font-weight:800;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--sun);margin-right:8px}
h1{font-size:clamp(30px,7vw,44px);line-height:1.05;letter-spacing:-.03em;margin:28px 0 8px}
h2{font-size:22px;margin:28px 0 10px}
p{margin:0 0 12px}.mute{color:var(--mute)}
input,textarea{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0 10px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 18px;background:var(--sun);color:#17201B;cursor:pointer}
button.alt{background:var(--green);color:#FAFAF5}
button.link{background:none;padding:4px 0;font-weight:400;color:var(--mute);text-decoration:underline}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card small{color:var(--mute);display:block}
.err{color:#C0392B;min-height:22px;word-break:break-word}
.hide{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
</style>
</head>
<body>
<main>
<div class="brand"><span><i></i>Phomab</span><button class="link hide" id="out">Sign out</button></div>

<section id="s-login">
<h1>Say what you need. Phomab connects you.</h1>
<p class="mute">Sign in with your phone number.</p>
<div id="phoneBox">
<label for="ph">Phone number</label>
<input id="ph" type="tel" placeholder="078 123 4567" autocomplete="off">
<button id="send">Send code</button>
</div>
<div id="codeBox" class="hide">
<label for="cd">6-digit code from SMS</label>
<input id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
<button id="verify">Sign in</button>
</div>
<p class="err" id="err" role="alert"></p>
</section>

<section id="s-role" class="hide">
<h1>Welcome to Phomab</h1>
<label for="nm">Your name</label>
<input id="nm" autocomplete="name">
<p>I am a:</p>
<div class="row"><button class="alt" data-role="tenant">Tenant</button><button class="alt" data-role="landlord">Landlord</button></div>
<p class="err" id="err2" role="alert"></p>
</section>

<section id="s-tenant" class="hide">
<h2>What do you need?</h2>
<textarea id="req" rows="3" placeholder="I need a 3-roomed house in Nketha"></textarea>
<button id="post">Ask Phomab</button>
<h2>Your requests</h2>
<div id="mine"><p class="mute">No requests yet.</p></div>
</section>

<section id="s-landlord" class="hide">
<h2>Open requests</h2>
<div id="open"><p class="mute">No requests yet.</p></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig={
  apiKey:"AIzaSyB5NIgSzcINTZEeoM7RE3NgcqeDydvAsyE",
  authDomain:"pmata-26d51.firebaseapp.com",
  projectId:"pmata-26d51",
  storageBucket:"pmata-26d51.firebasestorage.app",
  messagingSenderId:"578984348713",
  appId:"1:578984348713:web:433c42c33a0a352f876038"
};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(),db=firebase.firestore();
var $=function(i){return document.getElementById(i)},me=null,unsubs=[],confirmation=null;

function show(id){['s-login','s-role','s-tenant','s-landlord'].forEach(function(s){$(s).classList.toggle('hide',s!==id)});$('out').classList.toggle('hide',id==='s-login')}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function ts(d){return d.createdAt?d.createdAt.toMillis():Date.now()}

/* Zimbabwe numbers: keep the last 9 digits and add +263 */
function fmt(n){var d=n.replace(/\D/g,'');if(d.length>9)d=d.slice(-9);return '+263'+d}
var recaptcha=new firebase.auth.RecaptchaVerifier('send',{size:'invisible'});
$('send').onclick=function(){
  $('err').textContent='';
  var num=fmt($('ph').value);
  auth.signInWithPhoneNumber(num,recaptcha).then(function(c){
    confirmation=c;$('phoneBox').classList.add('hide');$('codeBox').classList.remove('hide');
  }).catch(function(e){
    $('err').textContent='Error for '+num+': '+e.code+' | '+e.message;
    console.error(e);
    recaptcha.render().then(function(w){grecaptcha.reset(w)});
  });
};
$('verify').onclick=function(){
  confirmation.confirm($('cd').value.trim()).catch(function(e){$('err').textContent='Wrong code: '+e.code});
};
$('out').onclick=function(){auth.signOut()};

auth.onAuthStateChanged(function(u){
  unsubs.forEach(function(f){f()});unsubs=[];
  if(!u){me=null;show('s-login');$('phoneBox').classList.remove('hide');$('codeBox').classList.add('hide');return}
  db.collection('users').doc(u.uid).get().then(function(s){
    if(s.exists){me=Object.assign({uid:u.uid},s.data());start()}else{me={uid:u.uid};show('s-role')}
  });
});
document.querySelectorAll('[data-role]').forEach(function(b){b.onclick=function(){
  var n=$('nm').value.trim();if(!n){$('err2').textContent='Enter your name first.';return}
  var d={name:n,role:b.dataset.role,phone:auth.currentUser.phoneNumber};
  db.collection('users').doc(me.uid).set(d).then(function(){me=Object.assign({uid:me.uid},d);start()});
}});
function start(){me.role==='tenant'?tenant():landlord()}

function tenant(){
  show('s-tenant');var reqs=[],reps=[];
  function draw(){
    if(!reqs.length)return;
    $('mine').innerHTML=reqs.map(function(r){
      var rr=reps.filter(function(p){return p.requestId===r.id});
      return '<div class="card"><strong>'+esc(r.text)+'</strong>'+
        (rr.length?rr.map(function(p){return '<small>'+esc(p.landlordName)+': '+esc(p.rent)+(p.note?' - '+esc(p.note):'')+'</small>'}).join(''):'<small>Waiting for replies</small>')+'</div>'}).join('');
  }
  unsubs.push(db.collection('requests').where('uid','==',me.uid).onSnapshot(function(s){reqs=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return ts(b)-ts(a)});draw()}));
  unsubs.push(db.collection('replies').where('tenantId','==',me.uid).onSnapshot(function(s){reps=s.docs.map(function(d){return d.data()});draw()}));
  $('post').onclick=function(){
    var t=$('req').value.trim();if(!t)return;
    db.collection('requests').add({uid:me.uid,tenantName:me.name,text:t,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){$('req').value=''});
  };
}

function landlord(){
  show('s-landlord');
  unsubs.push(db.collection('requests').onSnapshot(function(s){
    var l=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return ts(b)-ts(a)});
    if(!l.length)return;
    $('open').innerHTML=l.map(function(r){
      return '<div class="card" data-id="'+r.id+'" data-t="'+r.uid+'"><strong>'+esc(r.text)+'</strong><small>From '+esc(r.tenantName||'a tenant')+'</small>'+
        '<input placeholder="Rent, e.g. US$150 / month" class="rent"><input placeholder="Note (optional)" class="note"><button class="alt rep">Send reply</button></div>'}).join('');
    document.querySelectorAll('.rep').forEach(function(b){b.onclick=function(){
      var c=b.closest('.card'),rent=c.querySelector('.rent').value.trim();if(!rent)return;
      db.collection('replies').add({requestId:c.dataset.id,tenantId:c.dataset.t,landlordId:me.uid,landlordName:me.name,rent:rent,note:c.querySelector('.note').value.trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){b.textContent='Sent'});
    }});
  }));
}
</script>
</body>
</html>
